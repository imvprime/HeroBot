name: Build HeroBot 26.3 (Fabric)

on:
  push:
    paths-ignore: ['.github/workflows/deps.yml', '.github/dump-cp.init.gradle.kts']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Find Carpet version for 26.3
        id: carpet
        run: |
          v=$(curl -s 'https://api.modrinth.com/v2/project/carpet/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].version_number')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build Fabric mod
        run: chmod +x gradlew && ./gradlew :herobot-mod:shadowJar -PcarpetVersion=${{ steps.carpet.outputs.version }} --stacktrace --no-daemon
      - name: Smoke test on a Fabric 26.3 dedicated server
        run: |
          mkdir -p srv/mods && cd srv
          inst=$(curl -s https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')
          curl -sfL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/26.3/0.19.5/$inst/server/jar"
          api=$(curl -s 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].files[0].url')
          curl -sfL -o mods/fabric-api.jar "$api"
          cp ../herobot-mod/build/libs/herobot-fabric-*.jar mods/
          ls mods; echo eula=true > eula.txt
          printf 'online-mode=false\n' > server.properties
          set +e
          touch cmds
          (tail -f cmds | java -Xmx2G -jar server.jar nogui > server.log 2>&1; echo "exit $?" >> server.log) &
          for i in $(seq 1 180); do grep -q 'Done (' server.log && break; grep -q '^exit' server.log && break; sleep 2; done
          for c in "herobot" "player TestBot spawn" "player TestBot jump" "player TestBot attack continuous" "player TestBot use" "player TestBot look north" "player TestBot move forward" "player TestBot stop" "execute at TestBot run summon tnt ~ ~ ~ {fuse:1}" "execute at TestBot run summon creeper ~2 ~ ~ {Fuse:1,ignited:1b}" "execute at TestBot run summon arrow ~ ~3 ~ {Motion:[0.0,-1.0,0.0]}" "execute at TestBot run setblock ~1 ~ ~ minecraft:piston[facing=west]" "execute at TestBot run setblock ~2 ~ ~ minecraft:redstone_block" "execute at TestBot run summon wind_charge ~ ~1 ~" "player TestBot2 spawn" "player TestBot2 attack once" "player TestBot2 kill"; do echo "$c" >> cmds; sleep 2; done
          sleep 5; echo stop >> cmds
          for i in $(seq 1 60); do grep -q '^exit' server.log && break; sleep 2; done
          pkill -f "tail -f cmds"
          echo "===== SERVER LOG ====="; cat server.log; ls crash-reports 2>/dev/null && cat crash-reports/* 
          grep -vE 'carpet/|api.mojang.com|sessionserver.mojang.com|MinecraftClientHttpException|^\s+at ' server.log | grep -E 'ERROR\]|Exception|Caused by|InvalidInjection|MixinApplyError|---- Minecraft Crash' > problems.txt
          if [ -s problems.txt ]; then echo "::error::Problems found in server log"; cat problems.txt; exit 1; fi
          grep -q 'Done (' server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herobot-fabric-26.3
          path: |
            herobot-mod/build/libs/*.jar
            srv/server.log
      - name: Publish jar to the builds branch
        run: |
          mkdir out && cp herobot-mod/build/libs/herobot-fabric-*.jar out/ && cd out
          git init -q -b builds
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "HeroBot Fabric 26.3 build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
