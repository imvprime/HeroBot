name: Build Paper plugin (26.3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew :herobot-plugin:shadowJar --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: herobot-paper-26.3
          path: herobot-plugin/build/libs/herobot-paper-*.jar
