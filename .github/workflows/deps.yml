name: Export compile classpath
on:
  push:
    paths: ['.github/workflows/deps.yml', '.github/dump-cp.init.gradle.kts']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Dump classpath
        run: |
          v=$(curl -s 'https://api.modrinth.com/v2/project/carpet/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].version_number')
          chmod +x gradlew
          ./gradlew -I .github/dump-cp.init.gradle.kts -PcarpetVersion=$v :herobot-common:compileJava dumpCp --no-daemon
      - name: Package JDK
        run: |
          tar -C "$JAVA_HOME" -czf jdk25.tar.gz .
          split -b 90m jdk25.tar.gz deps-out/jdk25.tar.gz.part-
          for f in $(find deps-out -type f -size +95M); do split -b 90m "$f" "$f.part-" && rm "$f"; done
          du -sh deps-out; find deps-out -maxdepth 2
      - name: Push deps branch
        run: |
          cd deps-out
          git init -q -b deps
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm deps
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" deps
